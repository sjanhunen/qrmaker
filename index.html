<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>qrmaker</title>
  </head>
  <body>
    <main>
      <h1>qrmaker</h1>

      <form id="options">
        <label>
          URL
          <input
            id="url"
            name="url"
            type="url"
            value="https://example.com"
            autocomplete="off"
            required
          />
        </label>

        <fieldset>
          <legend>Shape</legend>
          <label>
            <input type="radio" name="shape" value="square" checked />
            Square
          </label>
          <label>
            <input type="radio" name="shape" value="rounded" />
            Rounded
          </label>
        </fieldset>

        <label>
          Foreground
          <input id="foreground" name="foreground" type="color" value="#111111" />
        </label>

        <label>
          Background
          <input id="background" name="background" type="color" value="#ffffff" />
        </label>

        <div class="size-control">
          <span id="size-label">Size</span>
          <div class="stepper" role="group" aria-labelledby="size-label">
            <button type="button" id="size-decrease" aria-label="Decrease size">−</button>
            <output id="size-readout" for="size">288 × 288 px</output>
            <button type="button" id="size-increase" aria-label="Increase size">+</button>
          </div>
          <input type="hidden" id="size" name="size" value="288" />
        </div>

        <div class="actions">
          <button type="button" id="download-png">Download PNG</button>
          <button type="button" id="copy-png">Copy PNG</button>
        </div>
        <p id="export-status" class="export-status" role="status"></p>
      </form>

      <div id="preview" aria-label="QR code preview"></div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
